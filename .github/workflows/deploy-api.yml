name: Deploy

# One Cloudflare Worker serves the static site, the API and the WebSockets. Production is deployed from a team
# laptop (`bun run build`, then `cd apps/api && bun x wrangler deploy`), so this workflow runs only when started by
# hand (Actions -> Deploy -> Run workflow). It needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never cut a migration off halfway

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.API_URL || 'https://nullpointers-exams.np-api.workers.dev' }}
    steps:
      # Competition rule: no deploys between the submission deadline and evaluation.
      # Set the repo variable FREEZE_AT (e.g. 2026-11-27T19:30:00+05:00) and this job refuses to run after it.
      - name: Freeze guard
        if: ${{ vars.FREEZE_AT != '' }}
        run: |
          now=$(date -u +%s); freeze=$(date -u -d "${{ vars.FREEZE_AT }}" +%s)
          if [ "$now" -ge "$freeze" ]; then echo "::error::Past FREEZE_AT (${{ vars.FREEZE_AT }}). Not deploying."; exit 1; fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Tests must pass before anything ships
        run: bun run test

      - name: Build the static site (served by the Worker)
        run: bun run build

      - name: Apply D1 migrations
        working-directory: apps/api
        run: bun x wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker
        working-directory: apps/api
        run: bun x wrangler deploy

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf "$SITE_URL/api/health"; then echo; echo "Healthy: $SITE_URL"; exit 0; fi
            echo "waiting ($i/10)..."; sleep 3
          done
          echo "::error::Not healthy at $SITE_URL"; exit 1
