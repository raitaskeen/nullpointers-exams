name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck (shared, api, web)
        run: bun run typecheck

      - name: API tests (real Workers runtime + D1 + Durable Objects)
        run: bun run test

      - name: Static site build
        run: bun run build

      - name: Dependency audit (high+)
        run: bun audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Real browsers (desktop + phone) against the production build served the way production serves it: one local
  # Worker (wrangler dev) with the static export, the API and WebSockets on one origin, a fresh D1 and the demo data.
  # Checks journeys, zero console errors, axe WCAG A/AA and no sideways scroll down to 320px.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: http://127.0.0.1:8787
      ADMIN_PASSWORD: Admin@Demo2026 # the public demo account from the seed (README), not a secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
        working-directory: apps/web

      - name: Local Worker config, database and demo data
        working-directory: apps/api
        run: |
          cp .dev.vars.example .dev.vars
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .dev.vars
          bun x wrangler d1 migrations apply DB --local
          bun scripts/seed.ts --local
          bun scripts/seed-demo.ts --local

      - name: Build the static site
        run: bun run build

      - name: Start the Worker (site + API + WebSockets)
        run: |
          (cd apps/api && bun x wrangler dev --port 8787 --ip 127.0.0.1 > /tmp/worker.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf "$E2E_BASE_URL/api/health" > /dev/null && curl -sf "$E2E_BASE_URL/" > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/worker.log; exit 1

      - name: Playwright
        working-directory: apps/web
        run: bun x playwright test

      - name: Smoke
        run: bun run smoke -- "$E2E_BASE_URL"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/worker.log
          retention-days: 7
