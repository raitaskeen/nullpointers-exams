<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: oklch(0.986 0.0025 260);
        --fg: oklch(0.205 0.014 262);
        --muted: oklch(0.49 0.014 262);
        --line: oklch(0.918 0.006 262);
        --brand: oklch(0.515 0.165 256);
        --on-brand: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.158 0.008 262);
          --fg: oklch(0.955 0.004 262);
          --muted: oklch(0.72 0.012 262);
          --line: oklch(0.275 0.01 262);
          --brand: oklch(0.72 0.16 256);
          --on-brand: oklch(0.17 0.03 256);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 26rem; text-align: center; }
      .mark { width: 48px; height: 48px; margin: 0 auto 28px; }
      .signal { display: flex; justify-content: center; gap: 4px; align-items: flex-end; height: 22px; margin-bottom: 20px; }
      .signal span { width: 6px; border-radius: 3px; background: var(--line); }
      .signal span:nth-child(1) { height: 6px; background: var(--brand); }
      .signal span:nth-child(2) { height: 12px; }
      .signal span:nth-child(3) { height: 17px; }
      .signal span:nth-child(4) { height: 22px; }
      h1 { margin: 0 0 8px; font-size: 1.625rem; line-height: 1.25; letter-spacing: -0.02em; font-weight: 650; text-wrap: balance; }
      p { margin: 0 0 28px; color: var(--muted); text-wrap: pretty; }
      button {
        appearance: none; border: 0; cursor: pointer;
        min-height: 44px; padding: 0 20px; border-radius: 10px;
        background: var(--brand); color: var(--on-brand);
        font: 600 15px/1 inherit; font-family: inherit;
        box-shadow: 0 6px 16px -6px color-mix(in oklch, var(--brand) 60%, transparent);
      }
      button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
      .hint { margin-top: 16px; font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--brand)" />
        <path d="M11 9.5 L19.5 16 L11 22.5" fill="none" stroke="var(--on-brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="22.5" cy="22" r="2" fill="var(--on-brand)" opacity="0.7" />
      </svg>
      <div class="signal" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1>You're offline</h1>
      <p>Your work is safe. This page will come back on its own as soon as your connection does.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <div class="hint" id="hint" aria-live="polite">Waiting for a connection…</div>
    </main>
    <script>
      addEventListener("online", function () {
        document.getElementById("hint").textContent = "Back online - reloading…";
        location.reload();
      });
    </script>
  </body>
</html>
